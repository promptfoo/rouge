name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish again
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
    steps:
      - name: Wait for exact-commit CI and security checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required=("build (18)" "build (20)" "build (22)" "build (24)" "Analyze (actions)" "Analyze (javascript-typescript)")
          while true; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            pending=0
            for name in "${required[@]}"; do
              result="$(jq -r --arg name "$name" '[.check_runs[] | select(.app.slug == "github-actions" and .name == $name)][0] | "\(.status // "missing") \(.conclusion // "")"' <<< "$runs")"
              case "$result" in
                'completed success') ;;
                completed*) echo "$name failed: $result"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 10
          done

  release-please:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      # Use GitHub App token so the created PR triggers CI workflows
      # (PRs created with GITHUB_TOKEN don't trigger workflows to prevent loops)
      # Pin to SHA for supply chain security
      - name: Create GitHub App Token
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.PROMPTFOOBOT_APP_ID }}
          private-key: ${{ secrets.PROMPTFOOBOT_APP_PRIVATE_KEY }}

      - name: Release Please
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Select release publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Release $RELEASE_TAG points to $target, not $GITHUB_SHA"
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "publish=${RELEASE_CREATED:-false}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin to SHA for supply chain security
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Pack and validate release artifact
        run: |
          mkdir release-package
          npm pack --pack-destination release-package
          npm run test:package -- release-package/*.tgz
      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-package/*.tgz
          if-no-files-found: error
          compression-level: 0

  publish-npm:
    needs: [build, release-please]
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-package
      # Node 24 required for npm OIDC trusted publishing (npm 11.5.1+)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Publishing uses npm's OIDC trusted publishers for authentication.
      # This requires npm 11.5.1+ (Node 24 includes npm 11.6.0) and the package
      # must be configured on npmjs.com to trust this GitHub repository/workflow.
      # See: https://docs.npmjs.com/trusted-publishers/
      # The --provenance flag generates SLSA Build Level 3 attestation for supply chain security.
      - run: npm publish release-package/*.tgz --access public --provenance
