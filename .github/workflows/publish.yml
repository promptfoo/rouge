name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish again
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    uses: ./.github/workflows/validate-commit.yml
    permissions:
      checks: read
    with:
      sha: ${{ github.sha }}

  release-please:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      sha: ${{ steps.publication.outputs.sha }}
      tag: ${{ steps.publication.outputs.tag }}
    steps:
      # Use GitHub App token so the created PR triggers CI workflows
      # (PRs created with GITHUB_TOKEN don't trigger workflows to prevent loops)
      # Pin to SHA for supply chain security
      - name: Create GitHub App Token
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.PROMPTFOOBOT_APP_ID }}
          private-key: ${{ secrets.PROMPTFOOBOT_APP_PRIVATE_KEY }}

      - name: Release Please
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Select release publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$RELEASE_CREATED" != 'true' ]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_TAG="$CREATED_TAG"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo 'Release creation did not return a tag'
            exit 1
          fi
          tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release $RELEASE_TAG did not resolve to a commit"
            exit 1
          fi
          printf 'publish=true\nsha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.release-please.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-commit.yml
    permissions:
      checks: read
    with:
      sha: ${{ needs.release-please.outputs.sha }}

  build:
    needs: [release-please, validate-release]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.validate-release.result == 'success' && needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin to SHA for supply chain security
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Capture workflow package validator
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "$WORKFLOW_SHA:scripts/package-smoke.js" > "$RUNNER_TEMP/package-smoke.cjs"
      - name: Checkout validated release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Pack and validate release artifact
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.prepack ? 0 : 1)"; then
            npm run build
          fi
          mkdir release-package
          npm pack --pack-destination release-package
          set -- release-package/*.tgz
          test "$#" -eq 1 && test -f "$1"
          sha256sum "$1" > release-package/SHA256SUMS
          legacy=false
          if [ "$RELEASE_SHA" != "$WORKFLOW_SHA" ] && git merge-base --is-ancestor "$RELEASE_SHA" "$WORKFLOW_SHA"; then
            legacy=true
          fi
          JS_ROUGE_SOURCE_ROOT="$GITHUB_WORKSPACE" JS_ROUGE_ALLOW_LEGACY_PACKAGE="$legacy" npm_execpath="$(command -v npm)" \
            node "$RUNNER_TEMP/package-smoke.cjs" "$1"
          sha256sum --check release-package/SHA256SUMS
      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            release-package/*.tgz
            release-package/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish-npm:
    needs: [build, release-please]
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.build.result == 'success' && needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pin to SHA for supply chain security
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout validated release commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-package
      - name: Verify downloaded package hash
        run: sha256sum --check release-package/SHA256SUMS
      # Node 24 required for npm OIDC trusted publishing (npm 11.5.1+)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      # Publishing uses npm's OIDC trusted publishers for authentication.
      # This requires npm 11.5.1+ (Node 24 includes npm 11.6.0) and the package
      # must be configured on npmjs.com to trust this GitHub repository/workflow.
      # See: https://docs.npmjs.com/trusted-publishers/
      # The --provenance flag signs an attestation for this workflow and archive.
      - name: Publish the selected release
        # Provenance identifies the authenticated workflow revision. The release
        # checkout and artifact hash checks above bind the package to its source.
        run: npm publish ./release-package/*.tgz --access public --provenance
