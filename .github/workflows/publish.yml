name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish again
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
    uses: ./.github/workflows/validate-commit.yml
    permissions:
      checks: read
    with:
      sha: ${{ github.sha }}

  release-please:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      sha: ${{ steps.publication.outputs.sha }}
      tag: ${{ steps.publication.outputs.tag }}
    steps:
      # Use GitHub App token so the created PR triggers CI workflows
      # (PRs created with GITHUB_TOKEN don't trigger workflows to prevent loops)
      # Pin to SHA for supply chain security
      - name: Create GitHub App Token
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.PROMPTFOOBOT_APP_ID }}
          private-key: ${{ secrets.PROMPTFOOBOT_APP_PRIVATE_KEY }}

      - name: Release Please
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Select release publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$RELEASE_CREATED" != 'true' ]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_TAG="$CREATED_TAG"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo 'Release creation did not return a tag'
            exit 1
          fi
          tag="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release $RELEASE_TAG did not resolve to a commit"
            exit 1
          fi
          printf 'publish=true\nsha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-commit.yml
    permissions:
      checks: read
    with:
      sha: ${{ needs.release-please.outputs.sha }}

  build:
    needs: [release-please, validate-release]
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin to SHA for supply chain security
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: [build, release-please]
    if: ${{ needs.release-please.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pin to SHA for supply chain security
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      # Node 24 required for npm OIDC trusted publishing (npm 11.5.1+)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Publishing uses npm's OIDC trusted publishers for authentication.
      # This requires npm 11.5.1+ (Node 24 includes npm 11.6.0) and the package
      # must be configured on npmjs.com to trust this GitHub repository/workflow.
      # See: https://docs.npmjs.com/trusted-publishers/
      # The --provenance flag generates SLSA Build Level 3 attestation for supply chain security.
      - name: Publish the selected release
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        # npm reads these fields for the source recorded in its provenance.
        run: GITHUB_SHA="$RELEASE_SHA" GITHUB_REF="refs/tags/$RELEASE_TAG" npm publish --access public --provenance
